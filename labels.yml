- {name: "backend:metal", color: "8e8e93", description: "Metal (planned)"}
- {name: "slice:core", color: "0B0F1C", description: "Core slice, same on every backend"}
- {name: "slice:raytracing", color: "fbca04", description: "Ray tracing extension slice"}
