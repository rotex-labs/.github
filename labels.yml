# Shared label set for rotex-labs repositories.
- {name: "type:bug", color: "d73a4a", description: "Something is broken"}
- {name: "type:feature", color: "FFA81F", description: "New API feature or slice"}
- {name: "type:capability", color: "3FD0F2", description: "Native / Emulated / Absent support on a backend"}
- {name: "type:docs", color: "0075ca", description: "Documentation"}
- {name: "type:refactor", color: "c5def5", description: "Internal change, no behaviour change"}
- {name: "question", color: "d876e3", description: "Further information is requested"}
